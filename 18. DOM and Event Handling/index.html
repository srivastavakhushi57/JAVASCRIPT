<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Greet and Colour Change</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="container">

        <h1 id="greet">Hello</h1>

        <div class="boxes">
            <div class="box" id="red">Red</div>
            <div class="box" id="blue">Blue</div>
            <div class="box" id="green">Green</div>
            <div class="box" id="yellow">Yellow</div>
        </div>

        <div class="greeting-sec">
            <input type="text" id="nameInput" class="name" placeholder="Enter your name">
            <button id="btn">Greet</button>
        </div>

    </div>
    <script src="script.js"></script>
</body>
</html>
